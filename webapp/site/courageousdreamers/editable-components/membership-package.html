<div class="price-card rounded p-4 bg-white">
  <div class="d-flex flex-wrap justify-content-between align-items-center flex-column flex-sm-row">
    <div class="d-flex flex-column align-items-center align-items-sm-start">
      <div class="badge-primary">Courageous</div>
      <div class="h3 mb-1">$plan</div> 
    </div>
    <div class="col-sm-3 text-sm-right mb-sm-0">
      <div class="mb-2">
        <span class="text-primary font-weight-bold align-top">$</span>
        <span class="font-size-3 text-primary font-weight-bold">$price</span>
        <span class="font-size-1">/ mo</span>
      </div>
    </div>
  </div> 
  <ul class="list-unstyled mt-3 mb-4 text-start">
    #foreach( $feature in $features )
    <li class="mb-1 d-flex">
      <i class="text-primary fas fa-check me-2 mt-1"></i>
      <span>$feature</span>
    </li>
    #end
  </ul> 
  <div class="text-center mt-auto">
    <button type="button" class="btn btn-primary btn-wide transition-3d-hover">
      Select
    </button>
  </div>
</div>
