  <path d="M-15 -4C-10 -6 -6 -5 -4 -2M15 -4C10 -6 6 -5 4 -2" stroke="#b91c1c" stroke-width="2" fill="none"/>
</g>

<!-- card 2: register -->
<rect x="340" y="147" width="620" height="78" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
<circle cx="386" cy="186" r="22" fill="#f59e0b"/>
<text x="386" y="194" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
<text x="426" y="179" font-size="21" font-weight="700" fill="#0f172a">Describe tu negocio y confirma tus datos</text>
<text x="426" y="203" font-size="14" fill="#475569">Cuéntanos qué haces y cómo contactarte.</text>
<!-- document check icon -->
<g transform="translate(900 186)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-16" y="-24" width="32" height="44" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M-8 -12H8M-8 -4H8" stroke="#b45309" stroke-width="2" fill="none"/>
  <circle cx="8" cy="12" r="11" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <path d="M3 12L7 16L14 8" stroke="#ffffff" stroke-width="2.500" fill="none"/>
</g>

<!-- card 3: certification -->
<rect x="340" y="248" width="620" height="92" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
<circle cx="386" cy="294" r="22" fill="#22c55e"/>
<text x="386" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
<text x="426" y="278" font-size="21" font-weight="700" fill="#0f172a">Obtén tu certificación</text>
<text x="426" y="302" font-size="14" fill="#475569">Publicaremos tu negocio en línea, en grupos de WhatsApp</text>
<text x="426" y="321" font-size="14" fill="#475569">y en el directorio de negocios de Lake Atitlan.Life.</text>
