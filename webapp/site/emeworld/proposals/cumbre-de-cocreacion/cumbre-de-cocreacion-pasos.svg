<g transform="translate(900 85)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-22 -14C-12 -18 -4 -16 0 -10V18C-4 12 -12 10 -22 14Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
