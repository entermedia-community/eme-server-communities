<text x="36" y="132" font-size="15" fill="#2B1240">Welcome, dreamer! Where would you</text>
<text x="36" y="153" font-size="15" fill="#2B1240">like to start today?</text>

<!-- card 1: Join Us -->
<g transform="translate(20 196)">
