<text x="78" y="52" font-size="13.5" fill="#5E4A6E">Tell us about yourself and get started</text>
<text x="78" y="69" font-size="13.5" fill="#5E4A6E">building and scaling your dreams</text>
<path d="M366 33l9 9-9 9" fill="none" stroke="#5E4A6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
