<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="1 1 402 635" width="402" height="635" role="img" aria-labelledby="cd-t cd-d">
  <title id="cd-t">Courageous Dreamers chat menu</title>
