<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 402 635" width="100%" role="img" aria-labelledby="t d" class="b">
  <title id="t">Chat de Cumbre de Cocreación con el asistente Mi EME</title>
  <desc id="d">Un chat móvil en el canal Cumbre de Cocreación donde el bot de IA Mi EME da la bienvenida al usuario y presenta el menú: Business Coach, Capacitación y Certificación Empresarial y Directorio de Negocios.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=JetBrains+Mono:wght@500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
    .h { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; }
    .m { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; }
    .b { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
  <defs>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <clipPath id="screen"><rect x="16" y="16" width="372" height="605" rx="36"/></clipPath>
  </defs>


  <!-- phone -->
  <rect x="2" y="2" width="400" height="633" rx="48" fill="#0f172a"/>
  <rect x="16" y="16" width="372" height="605" rx="36" fill="#f1f5f9"/>
  <g clip-path="url(#screen)">
    <rect x="157" y="24" width="90" height="22" rx="11" fill="#0f172a"/>
    <text x="44" y="38" font-size="13" font-weight="700" fill="#0f172a">9:41</text>
    <g fill="#0f172a"><rect x="324" y="30" width="3" height="6" rx="1"/><rect x="329" y="27" width="3" height="9" rx="1"/><rect x="334" y="24" width="3" height="12" rx="1"/><rect x="343" y="26" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/><rect x="345" y="28" width="13" height="6" rx="1.5"/></g>

    <!-- header -->
    <path d="M16 52h372v66H16z" fill="#fff"/>
    <line x1="16" y1="118" x2="388" y2="118" stroke="#e2e8f0"/>
    <path d="M44 74l-8 11 8 11" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- logo: blue heart with a little rainbow -->
    <circle cx="84" cy="85" r="21" fill="#f8fafc" stroke="#e2e8f0"/>
    <g fill="none" stroke-width="2.4" stroke-linecap="round">
      <path d="M67 82A17 17 0 0 1 101 82" stroke="#ef4444"/>
      <path d="M70 82A14 14 0 0 1 98 82" stroke="#f59e0b"/>
      <path d="M73 82A11 11 0 0 1 95 82" stroke="#22c55e"/>
    </g>
    <path d="M84 100C71 91 69 82 75 79C79 77.500 82.500 79 84 82C85.500 79 89 77.500 93 79C99 82 97 91 84 100Z" fill="url(#heart)"/>
    <circle cx="100" cy="101" r="5.5" fill="#22c55e" stroke="#fff" stroke-width="2"/>
    <text x="116" y="82" font-size="16" font-weight="700" fill="#0f172a">Cumbre de Cocreación</text>
    <text x="116" y="100" font-size="12" fill="#64748b">83 miembros · General</text>
    <g fill="#2563eb"><circle cx="366" cy="76" r="2.2"/><circle cx="366" cy="85" r="2.2"/><circle cx="366" cy="94" r="2.2"/></g>

    <!-- date chip -->
    <rect x="156" y="130" width="92" height="20" rx="10" fill="#e2e8f0"/>
    <text x="202" y="144" text-anchor="middle" font-size="11" fill="#64748b">Hoy 9:41</text>

    <!-- Mi EME (AI bot) -->
    <circle cx="36" cy="212" r="14" fill="url(#ai)"/>
    <path d="M36 203l2.2 6.3 6.3 2.2-6.3 2.2L36 220l-2.2-6.3-6.3-2.2 6.3-2.2z" fill="#fff"/>
    <text x="58" y="178" font-size="11" font-weight="700" fill="#7c3aed">Mi EME</text>
    <rect x="98" y="167" width="52" height="14" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="124" y="177" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c3aed" letter-spacing=".6">BOT DE IA</text>
    <text x="380" y="178" text-anchor="end" font-size="10" fill="#94a3b8">Ahora</text>
    <rect x="58" y="188" width="322" height="374" rx="20" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="74" y="222" class="h" font-size="20" fill="#1e1b4b">¡Bienvenido!</text>
    <text x="74" y="248" class="b" font-size="14" fill="#1e1b4b">Tu incubadora de negocios en el Lago de</text>
    <text x="74" y="269" class="b" font-size="14" fill="#1e1b4b">Atitlán, Guatemala. Puedo ayudarte con:</text>

    <!-- Capacitación y Certificación Empresarial -->
    <circle cx="82" cy="292" r="2.4" fill="#7c3aed"/>
    <text x="96" y="296" class="b" font-size="12.5" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Capacitación y Certificación</tspan></text>
    <text x="96" y="312" class="b" font-size="12.5" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Empresarial:</tspan> Aprende los valores del</text>
    <text x="96" y="328" class="b" font-size="12.5" fill="#1e1b4b">desarrollo empresarial y obtén tu</text>
    <text x="96" y="344" class="b" font-size="12.5" fill="#1e1b4b">certificación en prácticas</text>
    <text x="96" y="360" class="b" font-size="12.5" fill="#1e1b4b">empresariales holísticas.</text>

    <!-- Business Coach -->
    <circle cx="82" cy="380" r="2.4" fill="#7c3aed"/>
    <text x="96" y="384" class="b" font-size="12.5" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Business Coach:</tspan> Acompañamiento</text>
    <text x="96" y="400" class="b" font-size="12.5" fill="#1e1b4b">estratégico que ayuda a los</text>
    <text x="96" y="416" class="b" font-size="12.5" fill="#1e1b4b">emprendedores tomar decisiones de</text>
    <text x="96" y="432" class="b" font-size="12.5" fill="#1e1b4b">negocio alineadas con ellos.</text>

    <!-- Directorio de Negocios -->
    <circle cx="82" cy="452" r="2.4" fill="#7c3aed"/>
    <text x="96" y="456" class="b" font-size="12.5" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Directorio de Negocios:</tspan> Registra tu</text>
    <text x="96" y="472" class="b" font-size="12.5" fill="#1e1b4b">negocio en el Lago de Atitlán y</text>
    <text x="96" y="488" class="b" font-size="12.5" fill="#1e1b4b">encuentra a otros con quienes podrías</text>
    <text x="96" y="504" class="b" font-size="12.5" fill="#1e1b4b">trabajar juntos.</text>

    <!-- input bar -->
    <rect x="16" y="575" width="372" height="46" fill="#fff"/>
    <line x1="16" y1="575" x2="388" y2="575" stroke="#e2e8f0"/>
    <circle cx="42" cy="598" r="12" fill="#e2e8f0"/>
    <path d="M42 592v12M36 598h12" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <rect x="64" y="584" width="272" height="28" rx="14" fill="#f1f5f9"/>
    <text x="80" y="603" font-size="13" fill="#94a3b8">Escribe tu mensaje...</text>
    <circle cx="360" cy="598" r="13" fill="url(#me)"/>
    <path d="M354 598h12M362 593l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
