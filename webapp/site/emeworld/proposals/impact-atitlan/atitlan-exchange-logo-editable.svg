  <circle cx="256" cy="256" r="247" fill="none" stroke="#1b1f24" stroke-width="3"/>
  <circle cx="256" cy="256" r="243" fill="none" stroke="#d3dae0" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1b1f24" stroke-width="3"/>
  <circle cx="256" cy="256" r="183.500" fill="none" stroke="#d3dae0" stroke-opacity=".3" stroke-width="2"/>
