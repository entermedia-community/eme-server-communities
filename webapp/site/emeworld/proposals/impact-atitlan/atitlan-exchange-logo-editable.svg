  <!-- lettering -->
  <g font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="29.700" letter-spacing="2.750" text-anchor="middle">
    <g fill="#1b1f24" transform="translate(1.500 2)"><text><textPath xlink:href="#topArc" startOffset="50%">ATITLÁN EXCHANGE</textPath></text>
    <text><textPath xlink:href="#botArc" startOffset="50%">EL PUEBLO EN ACCIÓN</textPath></text></g>
    <g fill="#f3ead2"><text><textPath xlink:href="#topArc" startOffset="50%">ATITLÁN EXCHANGE</textPath></text>
    <text><textPath xlink:href="#botArc" startOffset="50%">EL PUEBLO EN ACCIÓN</textPath></text></g>
  </g>

  <!-- parchment -->
  <circle cx="256" cy="256" r="178" fill="url(#parchment)"/>
  <g clip-path="url(#innerClip)">
