<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Atitlán Exchange — El pueblo en acción</title>
  <desc id="d">Circular emblem with a weathered steel ring bolted at the sides. The ring reads "ATITLÁN EXCHANGE" across the top and "EL PUEBLO EN ACCIÓN" across the bottom. Inside, on parchment, an open hand with a red heart on the palm offers a glowing lightbulb, in front of a dark mechanical gear.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa4ad"/><stop offset=".35" stop-color="#59626b"/><stop offset=".6" stop-color="#8a949d"/><stop offset="1" stop-color="#3f464e"/>
    </linearGradient>
    <linearGradient id="steelBolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3cbd2"/><stop offset="1" stop-color="#5d666f"/></linearGradient>
    <radialGradient id="parchment" cx=".5" cy=".42" r=".65">
      <stop offset="0" stop-color="#fbf0d3"/><stop offset=".7" stop-color="#f0dcae"/><stop offset="1" stop-color="#d9bd84"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6a8" stop-opacity=".95"/><stop offset=".55" stop-color="#ffd84a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbGlass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fffef0"/><stop offset=".6" stop-color="#ffe680"/><stop offset="1" stop-color="#f6b823"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0bf88"/><stop offset="1" stop-color="#d9965a"/></linearGradient>
    <clipPath id="innerClip"><circle cx="256" cy="256" r="174"/></clipPath>
    <path id="topArc" d="M56 256A200 200 0 0 1 456 256"/>
    <path id="botArc" d="M30 256A226 226 0 0 0 482 256"/>
    <g id="hand">
      <path d="M214 292C208 318 214 344 230 366C236 376 238 384 238 396L236 470L282 470L280 396C280 384 282 376 288 366C302 344 308 318 304 292Z"/>
      <path d="M217.6 295.3L210.1 213.6A8.0 8.0 0 0 1 225.9 211.6L238.4 292.7Z"/>
      <path d="M240.0 290.2L241.1 196.2A8.25 8.25 0 0 1 257.6 195.9L262.0 289.8Z"/>
      <path d="M262.5 291.1L272.4 206.6A8.0 8.0 0 0 1 288.4 208.0L283.5 292.9Z"/>
