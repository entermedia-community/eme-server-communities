    <circle cx="240" cy="162" r="66" fill="url(#glow)"/>
    <g stroke="#f3b412" stroke-width="4" stroke-linecap="round"><line x1="210.6" y1="143.0" x2="200.2" y2="137.0"/><line x1="223.0" y1="130.6" x2="217.0" y2="120.2"/><line x1="240.0" y1="126.0" x2="240.0" y2="114.0"/><line x1="257.0" y1="130.6" x2="263.0" y2="120.2"/><line x1="269.4" y1="143.0" x2="279.8" y2="137.0"/></g>
    <path d="M228 184C228 176 216 172 216 160A24 24 0 1 1 264 160C264 172 252 176 252 184Z" fill="url(#bulbGlass)" stroke="#2a2118" stroke-width="3" stroke-linejoin="round"/>
    <path d="M233 184V168Q240 156 247 168V184" fill="none" stroke="#c2410c" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 150A16 16 0 0 1 238 138" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <rect x="228" y="184" width="24" height="8" rx="2" fill="#8c949c" stroke="#2a2118" stroke-width="2.500"/>
    <rect x="229" y="192" width="22" height="7" rx="2" fill="#6b737b" stroke="#2a2118" stroke-width="2.500"/>
    <rect x="233" y="199" width="14" height="6" rx="3" fill="#3a3f45" stroke="#2a2118" stroke-width="2"/>

    <!-- hand -->
    <g transform="translate(0 22) rotate(-10 256 340)">
      <use xlink:href="#hand" fill="#2a2118" stroke="#2a2118" stroke-width="8" stroke-linejoin="round"/>
      <use xlink:href="#hand" fill="#e8b27c"/>
      <ellipse cx="219.5" cy="224.5" rx="4.5" ry="6.8" transform="rotate(-7 219.5 224.5)" fill="#f9d3cb" stroke="#c28a52" stroke-width="1.2"/><ellipse cx="249.6" cy="208.3" rx="4.6" ry="6.9" transform="rotate(-1 249.6 208.3)" fill="#f9d3cb" stroke="#c28a52" stroke-width="1.2"/><ellipse cx="279.4" cy="219.3" rx="4.5" ry="6.8" transform="rotate(5 279.4 219.3)" fill="#f9d3cb" stroke="#c28a52" stroke-width="1.2"/><ellipse cx="303.5" cy="245.8" rx="3.8" ry="5.9" transform="rotate(11 303.5 245.8)" fill="#f9d3cb" stroke="#c28a52" stroke-width="1.2"/><ellipse cx="196.2" cy="306.3" rx="5.3" ry="7.8" transform="rotate(-35 196.2 306.3)" fill="#f9d3cb" stroke="#c28a52" stroke-width="1.2"/>
