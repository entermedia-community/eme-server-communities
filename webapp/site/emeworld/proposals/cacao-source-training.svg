<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 402 635" width="100%" role="img" aria-labelledby="t d" class="b">
  <title id="t">Cacao Source: Employee Training</title>
  <desc id="d">Mobile screen showing five sample Employee Training modules for Cacao Source, each with a progress bar, and the overall progress toward completing onboarding.</desc>
  <style>
