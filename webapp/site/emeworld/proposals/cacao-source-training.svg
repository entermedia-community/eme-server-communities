    <rect x="28" y="540" width="348" height="66" rx="16" fill="#f6ece1" stroke="#dcc3a6"/>
    <circle cx="56" cy="573" r="17" fill="url(#ai)"/>
    <path d="M56 563l3 6.500 7 .8-5.200 4.800 1.500 7-6.300-3.600-6.300 3.600 1.500-7-5.200-4.800 7-.8z" fill="#fff"/>
    <text x="84" y="566" font-size="12" font-weight="700" fill="#4a2c1a">Finish all 5 modules</text>
    <text x="84" y="582" font-size="12" font-weight="700" fill="#4a2c1a">to complete your onboarding</text>
    <text x="84" y="597" font-size="10.5" fill="#7a4a2b">Learn at your own pace, right from your phone.</text>
