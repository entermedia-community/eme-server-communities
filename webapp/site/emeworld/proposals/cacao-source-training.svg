    <text x="78" y="372" font-size="10.5" fill="#64748b">Fair relationships with farmers and partners</text>
    <rect x="78" y="380" width="238" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="78" y="380" width="60" height="6" rx="3" fill="url(#me)"/>
    <text x="364" y="387" text-anchor="end" font-size="11" font-weight="700" fill="#5a3320">25%</text>
