    <text x="364" y="319" text-anchor="end" font-size="11" font-weight="700" fill="#5a3320">60%</text>
    <rect x="28" y="334" width="348" height="62" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="52" cy="365" r="15" fill="url(#me)"/>
