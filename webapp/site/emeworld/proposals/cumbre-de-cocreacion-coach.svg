<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" role="img" aria-labelledby="t d" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Tu coach personal de negocios con IA</title>
<desc id="d">Un teléfono con un coach de inteligencia artificial que ayuda a una persona a empezar su negocio, registrarlo y conectarse con otros líderes de negocios del Lago de Atitlán, con los volcanes y el lago de fondo.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
</defs>

<rect width="1000" height="440" rx="20" fill="url(#sky)"/>

<!-- sun -->
<circle cx="900" cy="392" r="30" fill="#f59e0b"/>

<!-- volcanoes -->
<path d="M90 440L225 366Q240 360 255 366L390 440Z" fill="#0f766e"/>
<path d="M330 440L458 384Q470 379 482 384L610 440Z" fill="#15803d"/>
<path d="M540 440L676 362Q690 355 704 362L840 440Z" fill="#115e59"/>

<!-- lake -->
<path d="M0 408Q31 398 62 408T124 408T186 408T248 408T310 408T372 408T434 408T496 408T558 408T620 408T682 408T744 408T806 408T868 408T930 408T992 408L1000 408L1000 420Q1000 440 980 440L20 440Q0 440 0 420Z" fill="url(#lake)"/>
<g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
  <path d="M60 424Q75 418 90 424T120 424"/>
  <path d="M260 428Q275 422 290 428T320 428"/>
  <path d="M470 424Q485 418 500 424T530 424"/>
  <path d="M690 428Q705 422 720 428T750 428"/>
  <path d="M880 424Q895 418 910 424T940 424"/>
</g>
<text x="500" y="432" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#ffffff" opacity=".9">LAGO DE ATITLÁN</text>

<!-- phone -->
<rect x="60" y="28" width="172" height="316" rx="28" fill="#0f172a"/>
<rect x="68" y="40" width="156" height="292" rx="20" fill="#ffffff"/>
<rect x="124" y="46" width="44" height="6" rx="3" fill="#0f172a" opacity=".85"/>
<!-- coach header -->
<rect x="68" y="60" width="156" height="42" fill="#f1f5f9"/>
<svg x="76" y="62" width="40" height="38" viewBox="62 62 44 42">
  <g fill="none" stroke-width="2.400" stroke-linecap="round">
    <path d="M67 82A17 17 0 0 1 101 82" stroke="#ef4444"/>
    <path d="M70 82A14 14 0 0 1 98 82" stroke="#f59e0b"/>
    <path d="M73 82A11 11 0 0 1 95 82" stroke="#22c55e"/>
  </g>
  <path d="M84 100C71 91 69 82 75 79C79 77.500 82.500 79 84 82C85.500 79 89 77.500 93 79C99 82 97 91 84 100Z" fill="url(#heart)"/>
</svg>
<text x="124" y="78" font-size="12" font-weight="700" fill="#0f172a">Tu coach</text>
<text x="124" y="93" font-size="10.500" fill="#475569">con IA a tu lado</text>

<!-- chat bubbles -->
<rect x="78" y="114" width="132" height="42" rx="12" fill="#e0f2fe"/>
<text x="88" y="132" font-size="11.500" fill="#0f172a">Hola, soy tu coach.</text>
<text x="88" y="148" font-size="11.500" fill="#0f172a">¿Qué negocio sueñas?</text>

<rect x="94" y="168" width="120" height="42" rx="12" fill="#dcfce7"/>
<text x="104" y="186" font-size="11.500" fill="#0f172a">Quiero vender mis</text>
<text x="104" y="202" font-size="11.500" fill="#0f172a">tejidos todo el año</text>

<rect x="78" y="222" width="132" height="42" rx="12" fill="#e0f2fe"/>
<text x="88" y="240" font-size="11.500" fill="#0f172a">Te guío paso a paso,</text>
<text x="88" y="256" font-size="11.500" fill="#0f172a">desde tu celular.</text>

<!-- typing dots -->
<rect x="94" y="276" width="52" height="28" rx="12" fill="#f1f5f9"/>
<circle cx="108" cy="290" r="3.500" fill="#94a3b8"/><circle cx="120" cy="290" r="3.500" fill="#94a3b8"/><circle cx="132" cy="290" r="3.500" fill="#94a3b8"/>
<rect x="78" y="312" width="132" height="12" rx="6" fill="#f1f5f9"/>

<!-- flow arrows -->
<g fill="none" stroke-width="3.500" stroke-linecap="round" stroke-dasharray="2 9">
  <path d="M236 186C290 186 290 85 334 85" stroke="#ef4444"/>
  <path d="M236 186C290 186 290 186 334 186" stroke="#f59e0b"/>
  <path d="M236 186C290 186 290 287 334 287" stroke="#22c55e"/>
</g>

<!-- card 1: start -->
<rect x="340" y="46" width="620" height="78" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
<circle cx="386" cy="85" r="22" fill="#ef4444"/>
<text x="386" y="93" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
<text x="426" y="78" font-size="21" font-weight="700" fill="#0f172a">Empieza tu negocio</text>
<text x="426" y="102" font-size="14" fill="#475569">Convierte tu idea en un plan con pasos claros y alcanzables.</text>
<!-- seedling icon -->
<g transform="translate(900 85)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 22V-2" stroke="#15803d" stroke-width="3"/>
  <path d="M0 6C-18 6 -22 -8 -22 -16C-8 -16 0 -8 0 6Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M0 -2C14 -2 20 -12 20 -22C8 -22 0 -14 0 -2Z" fill="#86efac" stroke="#15803d" stroke-width="2"/>
</g>

<!-- card 2: register -->
<rect x="340" y="147" width="620" height="78" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
<circle cx="386" cy="186" r="22" fill="#f59e0b"/>
<text x="386" y="194" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
<text x="426" y="179" font-size="21" font-weight="700" fill="#0f172a">Regístralo</text>
<text x="426" y="203" font-size="14" fill="#475569">Te acompaña a formalizarlo y a aparecer en el directorio del lago.</text>
<!-- document check icon -->
<g transform="translate(900 186)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-16" y="-24" width="32" height="44" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M-8 -12H8M-8 -4H8" stroke="#b45309" stroke-width="2" fill="none"/>
  <circle cx="8" cy="12" r="11" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <path d="M3 12L7 16L14 8" stroke="#ffffff" stroke-width="2.500" fill="none"/>
</g>

<!-- card 3: network -->
<rect x="340" y="248" width="620" height="78" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
<circle cx="386" cy="287" r="22" fill="#22c55e"/>
<text x="386" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
<text x="426" y="280" font-size="21" font-weight="700" fill="#0f172a">Conéctate</text>
<text x="426" y="304" font-size="14" fill="#475569">Conoce a otros líderes de negocios del lago y crezcan juntos.</text>
<!-- network icon -->
<g transform="translate(900 287)">
  <g stroke="#1d4ed8" stroke-width="2.500" stroke-linecap="round">
    <path d="M0 -4L-20 -18M0 -4L20 -18M0 -4L-14 18M0 -4L16 18M-20 -18L20 -18" fill="none"/>
  </g>
  <circle cx="0" cy="-4" r="9" fill="url(#heart)"/>
  <circle cx="-20" cy="-18" r="6" fill="#ef4444"/>
  <circle cx="20" cy="-18" r="6" fill="#f59e0b"/>
  <circle cx="-14" cy="18" r="6" fill="#22c55e"/>
  <circle cx="16" cy="18" r="6" fill="#38bdf8"/>
</g>
</svg>
