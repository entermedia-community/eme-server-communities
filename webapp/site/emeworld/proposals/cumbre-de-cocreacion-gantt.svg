<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Metodología: Aprender Aplicando</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Los participantes aplican los conceptos directamente a sus negocios reales: evalúan su madurez digital actual,</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">identifican oportunidades, seleccionan las tecnologías adecuadas y definen acciones concretas para su ruta.</text>
<text x="96" y="116" class="b" font-size="15" fill="#e2e8f0">Meta: entender qué puede hacer la tecnología por su negocio, por dónde empezar y cuál es su siguiente paso.</text>
