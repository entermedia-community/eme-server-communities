<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 402 635" width="402" height="635" role="img" aria-labelledby="s5-t s5-d">
  <title id="s5-t">UN News EME chat with My EME assistant</title>
  <desc id="s5-d">A mobile chat in the UN News EME channel where the My EME AI bot welcomes the user and lists what it can help with: answer questions, tutor chat, search for media and run custom skills.</desc>
  <defs>
    <linearGradient id="s5-me" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="s5-ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <clipPath id="s5-screen"><rect x="16" y="16" width="372" height="605" rx="36"/></clipPath>
  </defs>


  <!-- phone -->
  <rect x="2" y="2" width="400" height="633" rx="48" fill="#0f172a"/>
  <rect x="16" y="16" width="372" height="605" rx="36" fill="#f1f5f9"/>
  <g clip-path="url(#s5-screen)">
    <rect x="157" y="24" width="90" height="22" rx="11" fill="#0f172a"/>
    <text x="44" y="38" font-size="13" font-weight="700" fill="#0f172a">9:41</text>
    <g fill="#0f172a"><rect x="324" y="30" width="3" height="6" rx="1"/><rect x="329" y="27" width="3" height="9" rx="1"/><rect x="334" y="24" width="3" height="12" rx="1"/><rect x="343" y="26" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/><rect x="345" y="28" width="13" height="6" rx="1.5"/></g>

    <!-- header -->
    <path d="M16 52h372v66H16z" fill="#fff"/>
    <line x1="16" y1="118" x2="388" y2="118" stroke="#e2e8f0"/>
    <path d="M44 74l-8 11 8 11" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="85" r="21" fill="url(#s5-me)"/>
    <text x="84" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">UN</text>
    <circle cx="100" cy="101" r="5.5" fill="#22c55e" stroke="#fff" stroke-width="2"/>
    <text x="116" y="82" font-size="16" font-weight="700" fill="#0f172a">UN News EME</text>
    <text x="116" y="100" font-size="12" fill="#64748b">1 members · General</text>
    <g fill="#2563eb"><circle cx="366" cy="76" r="2.2"/><circle cx="366" cy="85" r="2.2"/><circle cx="366" cy="94" r="2.2"/></g>

    <!-- date chip -->
    <rect x="156" y="130" width="92" height="20" rx="10" fill="#e2e8f0"/>
    <text x="202" y="144" text-anchor="middle" font-size="11" fill="#64748b">Today 9:41 AM</text>

    <!-- My EME (AI bot) -->
    <circle cx="36" cy="212" r="14" fill="url(#s5-ai)"/>
    <path d="M36 203l2.2 6.3 6.3 2.2-6.3 2.2L36 220l-2.2-6.3-6.3-2.2 6.3-2.2z" fill="#fff"/>
    <text x="58" y="178" font-size="11" font-weight="700" fill="#7c3aed">My EME</text>
    <rect x="104" y="167" width="44" height="14" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="126" y="177" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c3aed" letter-spacing=".6">AI BOT</text>
    <text x="380" y="178" text-anchor="end" font-size="10" fill="#94a3b8">Just now</text>
    <rect x="58" y="188" width="322" height="365" rx="20" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="74" y="222" class="h" font-size="20" fill="#1e1b4b">Welcome!</text>
    <text x="74" y="248" class="b" font-size="15" fill="#1e1b4b">Here are some things I can help you</text>
    <text x="74" y="269" class="b" font-size="15" fill="#1e1b4b">with in <tspan font-weight="700">EME Server</tspan>:</text>
    <circle cx="82" cy="292" r="2.4" fill="#7c3aed"/>
    <text x="96" y="296" class="b" font-size="15" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Answer Questions:</tspan> Gives AI answers</text>
    <text x="96" y="317" class="b" font-size="15" fill="#1e1b4b">about your catalog using</text>
    <text x="96" y="338" class="b" font-size="15" fill="#1e1b4b">semantic search.</text>
    <circle cx="82" cy="361" r="2.4" fill="#7c3aed"/>
    <text x="96" y="365" class="b" font-size="15" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Tutor Chat:</tspan> Guides learners</text>
    <text x="96" y="386" class="b" font-size="15" fill="#1e1b4b">step-by-step and tracks</text>
    <text x="96" y="407" class="b" font-size="15" fill="#1e1b4b">their mastery progress.</text>
    <circle cx="82" cy="430" r="2.4" fill="#7c3aed"/>
    <text x="96" y="434" class="b" font-size="15" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Search for Media:</tspan> Finds media from</text>
    <text x="96" y="455" class="b" font-size="15" fill="#1e1b4b">natural language requests.</text>
    <circle cx="82" cy="478" r="2.4" fill="#7c3aed"/>
    <text x="96" y="482" class="b" font-size="15" fill="#1e1b4b"><tspan font-weight="700" fill="#059669">Create Draft Article:</tspan> Helps editors</text>
    <text x="96" y="503" class="b" font-size="15" fill="#1e1b4b">research and write about</text>
    <text x="96" y="524" class="b" font-size="15" fill="#1e1b4b">world events.</text>

    <!-- input bar -->
    <rect x="16" y="575" width="372" height="46" fill="#fff"/>
    <line x1="16" y1="575" x2="388" y2="575" stroke="#e2e8f0"/>
    <circle cx="42" cy="598" r="12" fill="#e2e8f0"/>
    <path d="M42 592v12M36 598h12" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <rect x="64" y="584" width="272" height="28" rx="14" fill="#f1f5f9"/>
    <text x="80" y="603" font-size="13" fill="#94a3b8">Type your message...</text>
    <circle cx="360" cy="598" r="13" fill="url(#s5-me)"/>
    <path d="M354 598h12M362 593l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
