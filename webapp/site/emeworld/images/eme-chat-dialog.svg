<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 690" width="100%" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Peer-to-peer chat with EME assistant</title>
  <desc id="d">A mobile chat between Christopher and Tammy planning a conference trip, where the EME assistant offers to reserve tickets and schedule a carpool.</desc>
  <defs>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="8" result="b"/><feFlood flood-color="#000" flood-opacity=".3"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- phone -->
  <rect x="10" y="10" width="400" height="670" rx="48" fill="#0f172a" filter="url(#sh)"/>
  <rect x="24" y="24" width="372" height="642" rx="36" fill="#f1f5f9"/>
  <rect x="165" y="32" width="90" height="22" rx="11" fill="#0f172a"/>
  <text x="52" y="46" font-size="13" font-weight="600" fill="#0f172a">9:41</text>
  <g fill="#0f172a"><rect x="332" y="38" width="3" height="6" rx="1"/><rect x="337" y="35" width="3" height="9" rx="1"/><rect x="342" y="32" width="3" height="12" rx="1"/><rect x="351" y="34" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/><rect x="353" y="36" width="13" height="6" rx="1.5"/></g>

  <!-- header -->
  <path d="M24 60h372v66H24z" fill="#fff"/>
  <line x1="24" y1="126" x2="396" y2="126" stroke="#e2e8f0"/>
  <path d="M52 82l-8 11 8 11" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="93" r="21" fill="#f472b6"/>
  <text x="92" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">T</text>
  <circle cx="108" cy="109" r="5.5" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="124" y="90" font-size="16" font-weight="700" fill="#0f172a">Tammy</text>
  <text x="124" y="108" font-size="12" fill="#22c55e">Online</text>
  <g fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 84a3 3 0 0 0-3-3h-4c-1 0-2 1-2 2 0 12 10 22 22 22 1 0 2-1 2-2v-4a3 3 0 0 0-3-3l-4-1-3 3a14 14 0 0 1-6-6l3-3z" transform="translate(-6,-1) scale(.95)"/>
  </g>

  <!-- date chip -->
  <rect x="164" y="138" width="92" height="20" rx="10" fill="#e2e8f0"/>
  <text x="210" y="152" text-anchor="middle" font-size="11" fill="#64748b">Today 9:41 AM</text>

  <!-- Christopher (sent) -->
  <rect x="130" y="170" width="250" height="82" rx="20" fill="url(#me)"/>
  <g font-size="15" fill="#fff">
    <text x="146" y="196">Tammy, are you free to attend</text>
    <text x="146" y="216">the regional conference this</text>
    <text x="146" y="236">weekend?</text>
  </g>
  <text x="380" y="268" text-anchor="end" font-size="10" fill="#94a3b8">9:41 AM · Read</text>

  <!-- Tammy -->
  <circle cx="44" cy="318" r="14" fill="#f472b6"/>
  <text x="44" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">T</text>
  <rect x="66" y="282" width="196" height="62" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="15" fill="#0f172a">
    <text x="82" y="308">Yes! That sounds great,</text>
    <text x="82" y="328">let's do it.</text>
  </g>
  <text x="66" y="360" font-size="10" fill="#94a3b8">9:42 AM</text>

  <!-- assistant divider -->
  <line x1="40" y1="386" x2="118" y2="386" stroke="#c4b5fd"/>
  <text x="210" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="1">✦ EME ASSISTANT</text>
  <line x1="302" y1="386" x2="380" y2="386" stroke="#c4b5fd"/>

  <!-- EME Christopher -->
  <circle cx="44" cy="484" r="14" fill="url(#ai)"/>
  <path d="M44 475l2.2 6.3 6.3 2.2-6.3 2.2L44 492l-2.2-6.3-6.3-2.2 6.3-2.2z" fill="#fff"/>
  <text x="66" y="416" font-size="11" font-weight="700" fill="#7c3aed">EME Christopher</text>
  <rect x="66" y="424" width="314" height="102" rx="20" fill="#ede9fe" stroke="#c4b5fd"/>
  <g font-size="15" fill="#1e1b4b">
    <text x="82" y="450">I've checked both your schedules.</text>
    <text x="82" y="470">Christopher is open Sat 10AM.</text>
    <text x="82" y="490">Shall I reserve two tickets and</text>
    <text x="82" y="510">schedule a carpool ride?</text>
  </g>

  <!-- Tammy reply -->
  <circle cx="44" cy="574" r="14" fill="#f472b6"/>
  <text x="44" y="579" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">T</text>
  <rect x="66" y="550" width="150" height="42" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <text x="82" y="576" font-size="15" fill="#0f172a">Perfect, proceed!</text>
  <text x="66" y="606" font-size="10" fill="#94a3b8">9:43 AM</text>

  <!-- input bar -->
  <rect x="24" y="620" width="372" height="46" fill="#fff"/>
  <path d="M24 666v-30a16 16 0 0 1 0 0" fill="none"/>
  <line x1="24" y1="620" x2="396" y2="620" stroke="#e2e8f0"/>
  <circle cx="50" cy="643" r="12" fill="#e2e8f0"/>
  <path d="M50 637v12M44 643h12" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <rect x="72" y="629" width="272" height="28" rx="14" fill="#f1f5f9"/>
  <text x="88" y="648" font-size="13" fill="#94a3b8">Message</text>
  <circle cx="368" cy="643" r="13" fill="url(#me)"/>
  <path d="M362 643h12M370 638l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
