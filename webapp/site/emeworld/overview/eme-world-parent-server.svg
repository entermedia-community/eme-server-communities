<svg xmlns="http://www.w3.org/2000/svg" viewBox="512 452 1004 914" width="100%" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">EME World is the parent server</title>
<desc id="d">EME World, the parent server, sits in the middle and holds People and Teams. Around it, each connected EME Server has its own Collections and Tutorials, organized by topic, and a Data Tools node. Cumbre de Cocreación also has a Topics node, and its Tutorials connect to its Collections. A Server Chat Welcome node sits between it and EME World. Examples shown: UN News, Cumbre de Cocreación and your own EME Server.</desc>
