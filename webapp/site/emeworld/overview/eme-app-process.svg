<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="100%" role="img" aria-labelledby="t d">
<title id="t">How an eME app is created</title>
<desc id="d">A six step timeline: we listen, your private workspace, see it first, organize your information, build your app, test and go live.</desc>
<rect width="1200" height="590" rx="28" fill="#f7f6f4"/>
<text x="40" y="58" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#0a1a33" text-anchor="start" letter-spacing="0">From your idea to a live app</text>
<rect x="780" y="40" width="26" height="14" rx="7" fill="#3C5B00"/><text x="814" y="53" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">You and our team</text><rect x="976" y="40" width="26" height="14" rx="7" fill="#14284f"/><text x="1010" y="53" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">AI at work</text>
<line x1="560" y1="104" x2="1130" y2="104" stroke="#e1e6ef" stroke-width="3"/>
<text x="560" y="92" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5d6a82" text-anchor="start" letter-spacing="1.5">START</text><text x="1130" y="92" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5d6a82" text-anchor="end" letter-spacing="1.5">LIVE</text>
<line x1="674" y1="112" x2="674" y2="566" stroke="#e1e6ef" stroke-width="2" stroke-dasharray="3 8"/>
<line x1="788" y1="112" x2="788" y2="566" stroke="#e1e6ef" stroke-width="2" stroke-dasharray="3 8"/>
<line x1="902" y1="112" x2="902" y2="566" stroke="#e1e6ef" stroke-width="2" stroke-dasharray="3 8"/>
<line x1="1016" y1="112" x2="1016" y2="566" stroke="#e1e6ef" stroke-width="2" stroke-dasharray="3 8"/>
<rect x="20" y="124" width="1160" height="74" rx="14" fill="#ffffff"/>
<rect x="20" y="272" width="1160" height="74" rx="14" fill="#ffffff"/>
<rect x="20" y="420" width="1160" height="74" rx="14" fill="#ffffff"/>
<circle cx="62" cy="161.0" r="19" fill="#3C5B00"/><text x="62" y="167.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">1</text>
<text x="96" y="157.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">We listen</text><text x="96" y="183.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">You tell us what you need. We write it down in plain words.</text>
<rect x="560" y="138" width="91" height="38" rx="19" fill="#3C5B00"/><text x="605.6" y="163" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Talk</text>
<path d="M647 176 V212" stroke="#3d5078" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M640 205 l7 7 7 -7" stroke="#3d5078" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="62" cy="235.0" r="19" fill="#14284f"/><text x="62" y="241.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">2</text>
<text x="96" y="231.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">Your private workspace</text><text x="96" y="257.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">Your own secure eME server is set up, just for you.</text>
<rect x="628" y="212" width="103" height="38" rx="19" fill="#14284f"/><text x="679.7" y="237" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Set up</text>
<path d="M727 250 V286" stroke="#3d5078" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M720 279 l7 7 7 -7" stroke="#3d5078" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="62" cy="309.0" r="19" fill="#14284f"/><text x="62" y="315.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">3</text>
<text x="96" y="305.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">See it first</text><text x="96" y="331.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">AI sketches the screens so you can react before anything is built.</text>
<rect x="708" y="286" width="114" height="38" rx="19" fill="#14284f"/><text x="765.2" y="311" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Sketch</text>
<path d="M807 324 V360" stroke="#3d5078" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M800 353 l7 7 7 -7" stroke="#3d5078" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="62" cy="383.0" r="19" fill="#14284f"/><text x="62" y="389.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">4</text>
<text x="96" y="379.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">Organize your information</text><text x="96" y="405.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">Your information is arranged behind the scenes.</text>
<rect x="788" y="360" width="114" height="38" rx="19" fill="#14284f"/><text x="845.0" y="385" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Organize</text>
<path d="M887 398 V434" stroke="#3d5078" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M880 427 l7 7 7 -7" stroke="#3d5078" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="62" cy="457.0" r="19" fill="#14284f"/><text x="62" y="463.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">5</text>
<text x="96" y="453.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">Build your app</text><text x="96" y="479.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">Your app is built to run on phones, tablets and the web.</text>
<rect x="868" y="434" width="182" height="38" rx="19" fill="#14284f"/><text x="959.0" y="459" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Build</text>
<path d="M1035 472 V508" stroke="#3d5078" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M1028 501 l7 7 7 -7" stroke="#3d5078" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="62" cy="531.0" r="19" fill="#3C5B00"/><text x="62" y="537.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eeedeb" text-anchor="middle" letter-spacing="0">6</text>
<text x="96" y="527.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0a1a33" text-anchor="start" letter-spacing="0">Test and go live</text><text x="96" y="553.0" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5d6a82" text-anchor="start" letter-spacing="0">We test with you, launch, and save a version you can return to.</text>
<rect x="1016" y="508" width="114" height="38" rx="19" fill="#3C5B00"/><text x="1073.0" y="533" font-family="Jost, 'Avenir Next', 'Gill Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#eeedeb" text-anchor="middle" letter-spacing="0">Launch</text>
<path d="M1130 527 l16 -16 l16 16 l-16 16z" transform="translate(-14 0)" fill="#AEDE4A" stroke="#3C5B00" stroke-width="3"/>
</svg>
