<g transform="translate(0,0)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#8b5cf6"/>
<circle cx="58" cy="60.0" r="22" fill="#8b5cf6"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">1</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Ingest Material</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Upload raw interview audio/video,</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">background notes, or transcripts</text>
</g>
<g transform="translate(0,138)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#0ea5e9"/>
<circle cx="58" cy="60.0" r="22" fill="#0ea5e9"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">2</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Transcribe &amp; Index</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Automated speech-to-text conversion</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">and taxonomy tagging</text>
</g>
<g transform="translate(0,276)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#f59e0b"/>
<circle cx="58" cy="60.0" r="22" fill="#f59e0b"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">3</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Draft Synthesis</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Request article draft, key quotes</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">summary, and structure via chat</text>
</g>
<g transform="translate(0,414)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#10b981"/>
<circle cx="58" cy="60.0" r="22" fill="#10b981"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">4</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Multi-Lingual &amp; Alt Text</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Generate draft translations and</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">accessibility descriptions</text>
</g>
<g transform="translate(0,552)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#2EC4B6"/>
<circle cx="58" cy="60.0" r="22" fill="#2EC4B6"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">5</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Editorial Review</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Review, verify claims, adjust tone,</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">and approve draft</text>
</g>
<g transform="translate(0,690)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#AEDE4A"/>
<circle cx="58" cy="60.0" r="22" fill="#AEDE4A"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">6</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Push to CMS</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Execute command to push finalized</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">draft and assets to Drupal</text>
</g>
<g transform="translate(0,828)">
<rect width="410" height="120" rx="16" fill="#1e293b"/>
<path d="M16 0h8v120h-8a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="#8b5cf6"/>
<circle cx="58" cy="60.0" r="22" fill="#8b5cf6"/>
<text x="58" y="67.0" text-anchor="middle" class="h" font-size="20" fill="#0f172a">7</text>
<text x="96" y="44" class="h" font-size="19" fill="#f8fafc">Final Publication</text>
<text x="96" y="72" class="b" font-size="15" fill="#e2e8f0">Perform final layout verification</text>
<text x="96" y="94" class="b" font-size="15" fill="#e2e8f0">and publish live</text>
</g>
