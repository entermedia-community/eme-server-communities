<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1102 952" width="100%" role="img" aria-labelledby="t d" font-family="'Space Grotesk', system-ui, sans-serif">
<title id="t">UN News Editorial Workflow Gantt</title>
<desc id="d">Seven-step workflow shown as a staggered Gantt flow: ingest material, transcribe and index, draft synthesis, multi-lingual and alt text, editorial review, push to CMS, and final publication, each with its system and responsible role.</desc>
