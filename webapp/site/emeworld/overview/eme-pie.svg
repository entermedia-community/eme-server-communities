<svg xmlns="http://www.w3.org/2000/svg" viewBox="161 20 883 481" width="100%" role="img" aria-labelledby="t d" font-family="'Space Grotesk', system-ui, sans-serif">
  <title id="t">Our Values</title>
  <desc id="d">A four slice pie chart of EME World's values: Respect for Time, Stronger Together, Light on the Earth and Open to Everyone, each with a short statement of belief.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
    .h { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; }
    .b { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 500; }
  </style>
  <rect x="161" y="20" width="883" height="481" fill="#ffffff"/>
  <path d="M600 250L380.0 250.0A220 220 0 0 1 600.0 30.0Z" fill="#0284c7" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M600 250L600.0 30.0A220 220 0 0 1 820.0 250.0Z" fill="#7c3aed" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M600 250L820.0 250.0A220 220 0 0 1 600.0 470.0Z" fill="#059669" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M600 250L600.0 470.0A220 220 0 0 1 380.0 250.0Z" fill="#b45309" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <text x="506.0" y="170.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Respect for</text>
  <text x="506.0" y="196.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Time</text>
  <polyline points="444.4,94.4 360,94.4" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="444.4" cy="94.4" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
  <text x="350" y="77.4" text-anchor="end" class="b" fill="#000000" font-size="16">Technology carries the</text>
  <text x="350" y="99.4" text-anchor="end" class="b" fill="#000000" font-size="16">routine so people focus</text>
  <text x="350" y="121.4" text-anchor="end" class="b" fill="#000000" font-size="16">on <tspan font-weight="700">what matters.</tspan></text>
  <text x="694.0" y="170.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Stronger</text>
  <text x="694.0" y="196.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Together</text>
  <polyline points="755.6,94.4 840,94.4" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="755.6" cy="94.4" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <text x="850" y="66.4" text-anchor="start" class="b" fill="#000000" font-size="16">Communities solve</text>
  <text x="850" y="88.4" text-anchor="start" class="b" fill="#000000" font-size="16">problems best when</text>
  <text x="850" y="110.4" text-anchor="start" class="b" fill="#000000" font-size="16"><tspan font-weight="700">people and AI</tspan> work</text>
  <text x="850" y="132.4" text-anchor="start" class="b" fill="#000000" font-size="16"><tspan font-weight="700">side by side</tspan>.</text>
  <text x="694.0" y="322.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Light on</text>
  <text x="694.0" y="348.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">the Earth</text>
  <polyline points="755.6,405.6 840,405.6" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="755.6" cy="405.6" r="8" fill="#059669" stroke="#ffffff" stroke-width="3"/>
  <text x="850" y="366.6" text-anchor="start" class="b" fill="#000000" font-size="16">We honor <tspan font-weight="700">nature.</tspan></text>
  <text x="850" y="388.6" text-anchor="start" class="b" fill="#000000" font-size="16">Open-source tools on</text>
  <text x="850" y="410.6" text-anchor="start" class="b" fill="#000000" font-size="16">idle hardware and solar</text>
  <text x="850" y="432.6" text-anchor="start" class="b" fill="#000000" font-size="16">nodes keep technology</text>
  <text x="850" y="454.6" text-anchor="start" class="b" fill="#000000" font-size="16"><tspan font-weight="700">sustainable.</tspan></text>
  <text x="506.0" y="322.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Open to</text>
  <text x="506.0" y="348.0" text-anchor="middle" class="h" fill="#ffffff" font-size="22">Everyone</text>
  <polyline points="444.4,405.6 360,405.6" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="444.4" cy="405.6" r="8" fill="#b45309" stroke="#ffffff" stroke-width="3"/>
  <text x="350" y="388.6" text-anchor="end" class="b" fill="#000000" font-size="16"><tspan font-weight="700">Knowledge</tspan> belongs to</text>
  <text x="350" y="410.6" text-anchor="end" class="b" fill="#000000" font-size="16">everyone, with <tspan font-weight="700">free</tspan></text>
  <text x="350" y="432.6" text-anchor="end" class="b" fill="#000000" font-size="16">and <tspan font-weight="700">lifelong</tspan> access.</text>
</svg>
