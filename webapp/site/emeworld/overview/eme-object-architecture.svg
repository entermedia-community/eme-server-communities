<circle cx="698" cy="346" r="6" fill="#2EC4B6"/><text x="716.0" y="338.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Linux and Docker</text><text x="716.0" y="363.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Runs on Linux. Tools such as ffmpeg</text><text x="716.0" y="384.0" text-anchor="start" class="b" fill="#000000" font-size="15" >run in Docker containers.</text>
<circle cx="698" cy="496" r="6" fill="#f59e0b"/><text x="716.0" y="488.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Embedded ElasticSearch</text><text x="716.0" y="513.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Search lives inside the server.</text><text x="716.0" y="534.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Text and vector, no extra cluster.</text>
<circle cx="698" cy="646" r="6" fill="#E8C547"/><text x="716.0" y="638.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Pages and data as files</text><text x="716.0" y="663.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Pages are .xconf and HTML.</text><text x="716.0" y="684.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Data lists are XML. Plugins are Git.</text>
<circle cx="698" cy="796" r="6" fill="#10b981"/><text x="716.0" y="788.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Model Connectors</text><text x="716.0" y="813.0" text-anchor="start" class="b" fill="#000000" font-size="15" >One interface, many models:</text><text x="716.0" y="834.0" text-anchor="start" class="b" fill="#000000" font-size="15" >hosted, local or your own.</text>
<circle cx="698" cy="946" r="6" fill="#AEDE4A"/><text x="716.0" y="938.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Skills and Agent Jobs</text><text x="716.0" y="963.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Java skills run as agent jobs,</text><text x="716.0" y="984.0" text-anchor="start" class="b" fill="#000000" font-size="15" >managed by the Job Manager.</text>
<circle cx="698" cy="1096" r="6" fill="#2EC4B6"/><text x="716.0" y="1088.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Model Context Protocol</text><text x="716.0" y="1113.0" text-anchor="start" class="b" fill="#000000" font-size="15" >The server exposes its own MCP</text><text x="716.0" y="1134.0" text-anchor="start" class="b" fill="#000000" font-size="15" >endpoint and can call other tools.</text>
<circle cx="698" cy="1246" r="6" fill="#8b5cf6"/><text x="716.0" y="1238.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Public and private keys</text><text x="716.0" y="1263.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Crypto authentication. Logins are</text><text x="716.0" y="1284.0" text-anchor="start" class="b" fill="#000000" font-size="15" >signed with a private key.</text>
<circle cx="698" cy="1396" r="6" fill="#0ea5e9"/><text x="716.0" y="1388.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Websockets</text><text x="716.0" y="1413.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Real time, two way messages</text><text x="716.0" y="1434.0" text-anchor="start" class="b" fill="#000000" font-size="15" >between people and servers.</text>
<circle cx="698" cy="1546" r="6" fill="#0ea5e9"/><text x="716.0" y="1538.0" text-anchor="start" class="h" fill="#000000" font-size="17" >Flutter front ends</text><text x="716.0" y="1563.0" text-anchor="start" class="b" fill="#000000" font-size="15" >Flutter apps talk to the server:</text><text x="716.0" y="1584.0" text-anchor="start" class="b" fill="#000000" font-size="15" >EME.world and Data Tools.</text>
</svg>
