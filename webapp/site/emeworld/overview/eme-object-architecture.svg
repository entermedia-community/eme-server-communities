<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 1615" width="100%" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">EME Server object oriented architecture</title>
<desc id="d">The EME Server is object oriented. Below it is a tree of its parts, from the back end to the front end: Linux and Docker, an embedded ElasticSearch index with vector search, pages and data as files, Model Connectors, Skills and Agent Jobs with a Job Manager, an MCP server and client, public and private key signatures, Websockets, and Flutter front ends such as EME.world and Data Tools.</desc>
<style>
  .h { font-weight: 700; }
  .m { font-weight: 400; }
  .b { font-weight: 400; }
</style>
